<html lang="en">
<head>

    <meta charset="UTF-8">
    <title>Resume Analyzer</title>
    <!-- Bootstrap CSS -->
    <!-- (Old) 4.5.2 version -->
    <!-- <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"> -->

    <!-- CSS 5.3.3 version -->

    <style>
        body { margin-top: 40px; }
        .container { max-width: 800px }
        .result { margin-top: 20px; font-weight: bold; }
    </style>

    <!--<style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        textarea { width: 100%; height: 150px; }
        .container { max-width: 800px; margin: auto;}
        .error { color: red; }

    </style>-->
</head>

<body>
<div class="container">
    <h1 class="mb-4">AI Resume Analyzer</h1>

    <!-- Error handling -->
    {% if error %}
        <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}

    <!-- Form -->
    <form method="POST" enctype="multipart/form-data">

        <div class="form-group">
            <label for="resume_text">Resume Text: <small class="text-muted">(Not required if uploading PDF)</small></label>
            <textarea name="resume_text" id="resume_text" class="form-control" rows="5" placeholder="Paste resume text here...">{{ resume_text or '' }}</textarea>
        </div>

        <!--<br>-->

        <div class="form-group">
            <label for="pdf_file"> Or upload a PDF resume:</label>
            <input type="file" name="pdf_file" id="pdf_file" class="form-control-file" accept=".pdf">
        </div>

        <!--<br>-->

        <div class="form-group">
            <label for="job_description">Job Description <small class="text-muted">(Required)</small></label>
            <textarea name="job_description" id="job_description" class="form-control" rows="5" placeholder="Paste job description here...">{{ job_description or '' }}</textarea>
        </div>

        <!--<br>-->

        <button type="submit" class="btn btn-primary">Compute Match Score</button>
    </form>


    {% if match_percentage is not none %}
    <div class="result alert alert-info mt-4">
        <p>Match score: <strong>{{ match_percentage }}%</strong></p>
    </div>
    {% endif %}
</div>
    <!-- Bootstrap dependecies -->
    <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>

</body>
</html>
